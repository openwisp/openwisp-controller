name: AI Review

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] Only organization members can request reviews and pull request content is only read as data.
    types: [created]

permissions: {}

jobs:
  ai-review:
    if: >
      github.repository == 'openwisp/openwisp-controller' &&
      github.event.issue.pull_request &&
      contains(fromJSON('["MEMBER", "OWNER"]'), github.event.comment.author_association) &&
      (startsWith(github.event.comment.body, '/review') ||
       startsWith(github.event.comment.body, '/security-review') ||
       startsWith(github.event.comment.body, '/final-review'))
    permissions:
      contents: read
      pull-requests: read # Reads earlier reviews and comments for the final review.
    uses: openwisp/openwisp-actions/.github/workflows/reusable-ai-review.yml@master # zizmor: ignore[unpinned-uses] Pilot: uses the latest shared AI review logic so improvements apply to all repositories at once.
    secrets:
      APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
      OPENCODE_AUTH: ${{ secrets.OPENCODE_AUTH }}
