name: publiccode.yml validation

on: [pull_request, push]

permissions:
  contents: read

concurrency:
  group: publiccode-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publiccode_yml_validation:
    name: Validate publiccode.yml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: italia/publiccode-parser-action@f370d239aa3ec57b819909b467ff77679b6dc721 # v1
        with:
          publiccode: "publiccode.yml"
