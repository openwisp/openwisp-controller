---
name: OpenWISP Controller CI Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - "[0-9]+.[0-9]+"
      - "gsoc26-x509-certificate-generator-templates"
      - "gsoc26-mass-commands"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Python==${{ matrix.python-version }} | ${{ matrix.django-version }}
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        django-version:
          - django~=5.1.0
          - django~=5.2.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Cache APT packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Disable man page auto-update
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo dpkg-reconfigure man-db

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            **/requirements*.txt

      - name: Install Dependencies
        id: deps
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
        run: |
          sudo apt update
          sudo apt -qq -y install sqlite3 gdal-bin libproj-dev \
            libgeos-dev libspatialite-dev spatialite-bin \
            libsqlite3-mod-spatialite
          sudo npm install -g prettier
          pip install -U pip wheel setuptools
          pip install -U -r requirements-test.txt
          pip install -U -e .
          pip install "$DJANGO_VERSION"

      - name: Start redis
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: docker compose up -d redis

      - name: QA checks
        run: ./run-qa-checks

      - name: Tests
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: ./runtests
        env:
          SELENIUM_HEADLESS: 1
          GECKO_LOG: 1

      - name: Show gecko web driver log on failures
        if: ${{ failure() }}
        run: |
          [ -f geckodriver.log ] && cat geckodriver.log \
            || echo "there is no gecko web driver log to show"

      - name: Upload Coverage
        if: ${{ success() }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel: true
          format: cobertura
          flag-name: python-${{ matrix.python-version }}-${{ matrix.django-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false

  coveralls:
    name: Finalize Coveralls report
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          parallel-finished: true
          fail-on-error: false
