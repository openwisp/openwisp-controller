---
name: OpenWISP Controller CI Build

on:
  push:
    branches:
      - master
      - "gsoc26-*"
  pull_request:
    branches:
      - master
      - "[0-9]+.[0-9]+"
      - "gsoc26-*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python==${{ matrix.python-version }} | ${{ matrix.django-version }}
    runs-on: ubuntu-24.04
    env:
      AI_REVIEW_BROWSERS: firefox
      AI_REVIEW_SYSTEM_DEPS: "true"

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        django-version:
          - django~=5.2.0
          - django~=6.0.0
          - django~=6.1.0
        exclude:
          - python-version: "3.11"
            django-version: django~=6.0.0
          - python-version: "3.11"
            django-version: django~=6.1.0
          - python-version: "3.15"
            django-version: django~=5.2.0
          - python-version: "3.15"
            django-version: django~=6.0.0
        include:
          - python-version: "3.13"
            django-version: django~=6.1.0
            review_default: true # Used by on-demand AI reviews

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Cache APT packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/apt/archives
          key: >-
            apt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/ci.yml', 'install-ci-deps.sh') }}

      - name: Disable man page auto-update
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo dpkg-reconfigure man-db

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Identify runner image
        id: platform
        run: echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache pip downloads
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: >-
            ${{ format('{0}-{1}-{2}-pip-{3}-{4}-{5}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.python.outputs.python-version,
                matrix.django-version, hashFiles('setup.py', 'requirements-test.txt',
                'requirements.txt', 'install-ci-deps.sh')) }}

      - name: Install Dependencies
        id: deps
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
        run: ./install-ci-deps.sh

      - name: Start redis
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: docker compose up -d redis

      - name: QA checks
        run: ./run-qa-checks

      - name: Tests
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: ./runtests
        env:
          SELENIUM_HEADLESS: 1
          GECKO_LOG: 1

      - name: Show gecko web driver log on failures
        if: ${{ failure() }}
        run: |
          [ -f geckodriver.log ] && cat geckodriver.log \
            || echo "there is no gecko web driver log to show"

      - name: Upload Coverage
        if: ${{ success() }}
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel: true
          format: cobertura
          flag-name: python-${{ matrix.python-version }}-${{ matrix.django-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false

  coveralls:
    name: Finalize Coveralls report
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          parallel-finished: true
          fail-on-error: false
