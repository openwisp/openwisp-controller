name: AI Review

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] Only organization members can request reviews and pull request content is only read as data.
    types: [created]
  workflow_run:
    workflows: ["**"]
    types: [completed]

permissions: {}

jobs:
  ai-review:
    if: >
      github.repository == 'openwisp/openwisp-controller' &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        github.event.workflow_run.event == 'pull_request') ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        ((contains(fromJSON('["MEMBER", "OWNER"]'), github.event.comment.author_association) &&
          (startsWith(github.event.comment.body, '/review') ||
           startsWith(github.event.comment.body, '/security-review') ||
           startsWith(github.event.comment.body, '/final-review'))) ||
         (github.event.comment.user.type == 'Bot' &&
          startsWith(github.event.comment.body, '/ai-review-resume ')))))
    permissions:
      contents: read
      issues: read # Reads the issues linked in the pull request description.
      pull-requests: read # Reads the pull request description, reviews and comments.
    uses: openwisp/openwisp-actions/.github/workflows/reusable-bot-ai-review.yml@master # zizmor: ignore[unpinned-uses] Pilot: uses the latest shared AI review logic so improvements apply to all repositories at once.
    with:
      wait_for_ci: true
    secrets:
      APP_ID: ${{ secrets.OPENWISP_BOT_APP_ID }}
      PRIVATE_KEY: ${{ secrets.OPENWISP_BOT_PRIVATE_KEY }}
      OPENCODE_AUTH: ${{ secrets.OPENCODE_AUTH }}
